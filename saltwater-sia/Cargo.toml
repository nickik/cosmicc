[package]
name = "saltwater-sia"
version = "0.12.0"
edition = "2018"
description = "Cosmic C lowering from typed C HIR to SIA32 machine code"

[lib]
path = "lib.rs"

[dependencies]
cranelift-codegen = { git = "https://github.com/nickik/crainlift", rev = "8ecc42343f0f467b5d0a445ad97f9c4a77590b3f", features = ["std", "sia32"] }
cranelift-frontend = { git = "https://github.com/nickik/crainlift", rev = "8ecc42343f0f467b5d0a445ad97f9c4a77590b3f" }
saltwater-parser = { path = "../saltwater-parser", version = "0.11.0" }
target-lexicon = { git = "https://github.com/nickik/crainlift", rev = "8ecc42343f0f467b5d0a445ad97f9c4a77590b3f", package = "target-lexicon" }
