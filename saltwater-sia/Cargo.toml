[package]
name = "saltwater-sia"
version = "0.12.0"
edition = "2018"
description = "Cosmic C lowering from typed C HIR to SIA32 machine code"

[lib]
path = "lib.rs"

[dependencies]
cranelift-codegen = { git = "https://github.com/nickik/crainlift", rev = "5f10ca72f671d13a429203b51d2e98ba3a3c4c0e", features = ["std", "sia32"] }
cranelift-frontend = { git = "https://github.com/nickik/crainlift", rev = "5f10ca72f671d13a429203b51d2e98ba3a3c4c0e" }
saltwater-parser = { path = "../saltwater-parser", version = "0.11.0" }
target-lexicon = { git = "https://github.com/nickik/crainlift", rev = "5f10ca72f671d13a429203b51d2e98ba3a3c4c0e", package = "target-lexicon" }
