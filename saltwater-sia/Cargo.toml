[package]
name = "saltwater-sia"
version = "0.13.0"
edition = "2018"
description = "Cosmic C lowering from typed C HIR to SIA32 machine code"

[lib]
path = "lib.rs"

[dependencies]
cranelift-codegen = { git = "https://github.com/nickik/crainlift", rev = "5c3dc85e79c6502e83e3210a9a29b5aabbc0d441", features = ["std", "sia32"] }
cranelift-frontend = { git = "https://github.com/nickik/crainlift", rev = "5c3dc85e79c6502e83e3210a9a29b5aabbc0d441" }
saltwater-parser = { path = "../saltwater-parser", version = "0.13.0" }
target-lexicon = { git = "https://github.com/nickik/crainlift", rev = "5c3dc85e79c6502e83e3210a9a29b5aabbc0d441", package = "target-lexicon" }
