[package]
name = "saltwater-sia"
version = "0.13.0"
edition = "2018"
description = "Cosmic C lowering from typed C HIR to SIA32 machine code"

[lib]
path = "lib.rs"

[dependencies]
cranelift-codegen = { git = "https://github.com/nickik/crainlift", rev = "951ced55b67cc3b2cc76a04b1105a43e8aaf688d", features = ["std", "sia32"] }
cranelift-frontend = { git = "https://github.com/nickik/crainlift", rev = "951ced55b67cc3b2cc76a04b1105a43e8aaf688d" }
saltwater-parser = { path = "../saltwater-parser", version = "0.13.0" }
target-lexicon = { git = "https://github.com/nickik/crainlift", rev = "951ced55b67cc3b2cc76a04b1105a43e8aaf688d", package = "target-lexicon" }
