[package]
name = "cosmicc"
version = "0.12.0"
authors = ["Nick K <nickik@users.noreply.github.com>"]
edition = "2018"
rust-version = "1.98.1"
description = "A C compiler for Cosmic OS that emits SIA32 machine code."
repository = "https://github.com/nickik/cosmicc"
readme = "README.md"
categories = ["development-tools", "parser-implementations"]
license = "BSD-3-Clause"
keywords = ["C", "compiler", "recursive-descent", "cranelift"]
default-run = "cosmicc"
# The only build target in the maintained product is declared below.  The
# inherited host compiler remains in `src/main.rs` as historical reference,
# not as a Cargo target.
autobins = false
autotests = false
autobenches = false

[dependencies]
ansi_term = "0.12"
arcstr = "0.2"
pico-args = { version = "0.3.4", features = ["short-space-opt"] }
color-backtrace = { version = "0.4", default-features = false, optional = true }
atty = { version = "0.2", default-features = false }
git-testament = { version = "0.1", optional = true }
saltwater-sia = { path = "saltwater-sia" }

[features]
default = ["color-backtrace"]
# for internal use
_test_headers = []

[workspace]

[[bin]]
name = "cosmicc"
path = "src/cosmicc.rs"

[profile.release]
lto = true

[profile.test]
debug = false  # speeds up link time

[profile.bench]
opt-level = 3
debug = false
lto = true
debug-assertions = false
codegen-units = 1
incremental = false
overflow-checks = false

[package.metadata.docs.rs]
all-features = true
# opt-out of non-default targets
targets = []
